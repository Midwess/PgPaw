[package]
name = "pgpaw"
version = "0.2.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Midwess/PgPaw"
description = "Read-only Postgres cache + realtime server over an embedded pglite logical replica"

[workspace]
members = ["bench", "integration-tests"]

[lib]
name = "pgpaw"

[[bin]]
name = "pgpaw"
path = "src/main.rs"

[dependencies]
pglite-rs = { version = "0.2.6", features = ["replica", "multiple-process"] }
clap = { version = "4", features = ["derive", "env"] }
actix-web = "4"
actix-cors = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-postgres = "0.7"
sqlparser = { version = "0.52", features = ["visitor"] }
moka = { version = "0.12", features = ["future"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
jsonwebtoken = "9"
