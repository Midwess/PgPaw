[package]
name = "pgpaw-bench"
version = "0.2.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[features]
az-wire = ["pgpaw/az-wire"]

[[bin]]
name = "pgpaw-bench"
path = "src/main.rs"

[dependencies]
pgpaw = { path = ".." }
postgresql_embedded = "0.18"
actix-web = "4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1"
serde_json = "1"
anyhow = "1"
