[package]
name = "integration-tests"
version = "0.0.0"
edition = "2021"
publish = false

[features]
az-wire = ["pgpaw/az-wire"]

[lib]
name = "harness"
path = "src/lib.rs"

[dependencies]
pgpaw = { path = ".." }
pglite-rs = { version = "0.2.7", features = ["replica", "multiple-process"] }
actix-web = "4"
postgresql_embedded = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
jsonwebtoken = "9"
serde_json = "1"
tempfile = "3"
